name: HY WristNav signed test packages
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hy-delivery.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and verify matched signing pair
        run: bash HY_WristNav/tools/cloud-delivery.sh
      - name: Downloadable installation pair
        uses: actions/upload-artifact@v4
        with:
          name: HY_WristNav-0.1.0-install
          path: |
            HY_WristNav/delivery/*.apk
            HY_WristNav/delivery/*.rpk
            HY_WristNav/delivery/*.txt
          if-no-files-found: error
          retention-days: 30
      - name: Encrypted signing recovery (no plaintext private keys)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HY_WristNav-signing-recovery
          path: HY_WristNav/delivery/signing-backup.encrypted.json
          if-no-files-found: ignore
          retention-days: 90
